name: Build & Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Bundle Playwright Chromium into the package
        run: |
          PLAYWRIGHT_BROWSERS_PATH=0 playwright install chromium

      - name: Build macOS App with PyInstaller
        run: |
          pyinstaller --clean -y cgtips_desktop.spec

      - name: Create DMG and ZIP packages
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/CGTips-3D.app dist/CGTips-3D-macOS.zip
          hdiutil create -volname "CGTips 3D" -srcfolder dist/CGTips-3D.app -ov -format UDZO dist/CGTips-3D-macOS.dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            dist/CGTips-3D-macOS.dmg
            dist/CGTips-3D-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Bundle Playwright Chromium into the package
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          playwright install chromium

      - name: Build Windows Executable with PyInstaller
        run: |
          pyinstaller --clean -y cgtips_desktop.spec

      - name: Smoke test - launch the packaged app
        shell: pwsh
        run: |
          $browsers = Get-ChildItem -Directory dist/CGTips-3D/_internal/playwright/driver/package/.local-browsers -ErrorAction SilentlyContinue
          Write-Host "Bundled browsers: $($browsers.Name -join ', ')"
          if (-not $browsers) { Write-Host "::error::Chromium missing from bundle"; exit 1 }
          $env:QT_QUICK_BACKEND = "software"
          $p = Start-Process -FilePath dist/CGTips-3D/CGTips-3D.exe -PassThru `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Start-Sleep -Seconds 25
          Write-Host "--- stdout ---"; Get-Content out.txt -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"; Get-Content err.txt -ErrorAction SilentlyContinue
          if ($p.HasExited) { Write-Host "::error::App exited early with code $($p.ExitCode)"; exit 1 }
          Write-Host "App is running (pid $($p.Id), window title: '$($p.MainWindowTitle)')"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("smoke.png")
          Stop-Process -Id $p.Id -Force

      - name: Upload smoke-test screenshot
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-test
          path: smoke.png
          if-no-files-found: ignore

      - name: Package Windows Binary
        shell: pwsh
        run: |
          Compress-Archive -Path dist/CGTips-3D -DestinationPath dist/CGTips-3D-Windows.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/CGTips-3D-Windows.zip

  publish-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Inspect release assets
        run: |
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "CGTips 3D Desktop ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/CGTips-3D-macOS.dmg
            release-assets/CGTips-3D-macOS.zip
            release-assets/CGTips-3D-Windows.zip
